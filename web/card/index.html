<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#fbfcfe">
<title>成绩名片 · {{BOT}} 音游查分</title>
<link rel="stylesheet" href="/yume.css?v=310">
<link rel="stylesheet" href="/card/app.css?v=310">
<script src="/yume.js?v=310"></script>
</head>
<body data-bot="{{BOT}}" data-qq="{{QQ}}">
<div id="sky" aria-hidden="true"></div>
<main class="wrap">
  <a class="brand" href="/">{{BOT}} 音游查分</a>
  <div class="rule" aria-hidden="true"><i></i><i></i></div>

  <header class="head">
    <h1><span id="who">&nbsp;</span><span class="h1b">成绩名片</span></h1>
    <p class="lede" id="lede">正在翻名片…</p>
  </header>

  <nav class="tabs" id="tabs" aria-label="游戏" hidden></nav>

  <section class="panel" id="panel" hidden>
    <div class="num">
      <div class="num-l">
        <p class="label" id="label">&nbsp;</p>
        <p class="rating"><span id="rating">—</span><span class="delta" id="delta" hidden></span></p>
        <p class="when" id="when">&nbsp;</p>
      </div>
      <div class="trend">
        <div class="spark" id="spark" aria-hidden="true"></div>
        <p class="since" id="since"></p>
      </div>
    </div>
    <a class="shot" id="shot" target="_blank" rel="noopener">
      <img id="img" alt="成绩图" decoding="async">
      <span class="shot-tip">点开看大图</span>
    </a>
  </section>

  <section class="empty" id="empty" hidden>
    <div class="empty-girl" id="emptyGirl" aria-hidden="true"></div>
    <p class="empty-t">名片还是空的</p>
    <p class="empty-s">主人开了名片，但还没查过成绩。</p>
  </section>

  <section class="cta">
    <div class="cta-girl" id="ctaGirl" aria-hidden="true"></div>
    <div class="cta-b">
      <h2>我也要一张</h2>
      <p id="ctaText">加 {{BOT}} 好友或者把它拉进群，发 <code>/网页绑定</code> 绑好账号，再发 <code>/名片 开</code>。</p>
      <a class="go" href="/">去主页看看怎么用</a>
    </div>
  </section>

  <footer class="foot">
    <p>这是主人自己公开的名片，上面只有成绩图里本来就有的内容。</p>
    <p>Generated by {{BOT}}</p>
  </footer>
</main>
<script src="/card/app.js?v=310"></script>
</body>
</html>
