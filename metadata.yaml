desc: "舞萌 DX / 中二节奏 / 音击 / SOUND VOLTEX 的 QQ 查分插件（NapCat）。舞萌、中二支持国际服、日服、国服（落雪 / 水鱼）和私服（AquaDX / RinNET），音击支持官服和私服，出带曲绘的 B50 图；SDVX 和音击可以在手机网页上手动传分，出 VOLFORCE 50 图。另外有查歌和各服定数表、sdvx.in 谱面查询、群里猜歌小游戏（开字母 / 猜曲绘 / 猜谱面），账号在手机网页上绑定，密码不进聊天记录。"
